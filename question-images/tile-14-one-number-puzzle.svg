<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Number word code puzzle</title>
  <desc id="desc">Use the examples to decode the pairs 13, 92, 83, 32 and 21, then give one number.</desc>
  <rect width="1200" height="720" rx="42" fill="#fff8e8"/>
  <rect x="42" y="42" width="1116" height="636" rx="30" fill="#fffdf8" stroke="#1b3850" stroke-width="7"/>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5" fill="#1b3850">NUMBER WORD CODE</text>
  <text x="600" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111827">Use the hints, then give one number</text>
  <g font-family="Arial, sans-serif" fill="#111827">
    <text x="130" y="232" font-size="27" font-weight="700" fill="#1b3850">QUESTION</text>
    <g font-size="70" font-weight="700">
      <rect x="285" y="178" width="120" height="82" rx="14" fill="#ffdd73"/><text x="345" y="240" text-anchor="middle">13</text>
      <rect x="425" y="178" width="120" height="82" rx="14" fill="#a9c7ff"/><text x="485" y="240" text-anchor="middle">92</text>
      <rect x="565" y="178" width="120" height="82" rx="14" fill="#ffb29e"/><text x="625" y="240" text-anchor="middle">83</text>
      <rect x="705" y="178" width="120" height="82" rx="14" fill="#b9e7cb"/><text x="765" y="240" text-anchor="middle">32</text>
      <rect x="845" y="178" width="120" height="82" rx="14" fill="#d9c7ff"/><text x="905" y="240" text-anchor="middle">21</text>
      <text x="1015" y="235" font-size="72">= ?</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" fill="#1b3850">
    <rect x="120" y="316" width="960" height="112" rx="20" fill="#e9f1ff"/>
    <text x="165" y="360" font-size="25" font-weight="700">HINT 1</text>
    <text x="600" y="392" text-anchor="middle" font-size="48" font-weight="700" fill="#111827">04   75   54  =  1</text>
    <rect x="120" y="464" width="960" height="140" rx="20" fill="#fff0cc"/>
    <text x="165" y="510" font-size="25" font-weight="700">HINT 2</text>
    <text x="600" y="558" text-anchor="middle" font-size="45" font-weight="700" fill="#111827">21   84   44   72   54  =  3</text>
  </g>
</svg>
