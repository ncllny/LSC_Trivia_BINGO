<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Number word code puzzle</title>
  <desc id="desc">Decode the pairs 13, 92, 83, 32, 21 to find one number.</desc>
  <rect width="1200" height="720" rx="42" fill="#fff8e8"/>
  <rect x="42" y="42" width="1116" height="636" rx="30" fill="#fffdf8" stroke="#1b3850" stroke-width="7"/>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="5" fill="#1b3850">NUMBER WORD CODE</text>
  <text x="600" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#111827">Find the one-number answer</text>
  <g font-family="Arial, sans-serif" font-size="74" font-weight="700" fill="#111827">
    <rect x="170" y="245" width="150" height="115" rx="18" fill="#ffdd73"/><text x="245" y="320" text-anchor="middle">13</text>
    <rect x="350" y="245" width="150" height="115" rx="18" fill="#a9c7ff"/><text x="425" y="320" text-anchor="middle">92</text>
    <rect x="530" y="245" width="150" height="115" rx="18" fill="#ffb29e"/><text x="605" y="320" text-anchor="middle">83</text>
    <rect x="710" y="245" width="150" height="115" rx="18" fill="#b9e7cb"/><text x="785" y="320" text-anchor="middle">32</text>
    <rect x="890" y="245" width="150" height="115" rx="18" fill="#d9c7ff"/><text x="965" y="320" text-anchor="middle">21</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#1b3850">
    <rect x="120" y="425" width="960" height="82" rx="18" fill="#e9f1ff"/>
    <text x="160" y="477" font-size="30" font-weight="700">Hint 1:</text><text x="320" y="477" font-size="29">The first digit names a number.</text>
    <rect x="120" y="530" width="960" height="82" rx="18" fill="#fff0cc"/>
    <text x="160" y="582" font-size="30" font-weight="700">Hint 2:</text><text x="320" y="582" font-size="29">The second digit chooses a letter from its number word.</text>
  </g>
</svg>