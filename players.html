<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Grid | Players</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="players.css">
</head>
<body>
  <main class="player-screen">
    <header class="player-header"><a class="brand" href="index.html"><span class="brand-mark">4</span><span>TRIVIA GRID</span></a><span>PLAYER VIEW</span></header>
    <section class="player-top"><p class="eyebrow">Now playing</p><h1 id="player-turn">Loading match…</h1><div id="player-timer" class="player-timer">30</div></section>
    <p id="player-question" class="player-question">Click a square to view its question.</p>
    <div id="player-grid" class="player-grid" aria-label="Live game board"></div>
    <footer class="player-scores"><span id="player-a">Team 01 · 0</span><span id="player-b">Team 02 · 0</span></footer>
  </main>
  <script src="players.js"></script>
</body>
</html>
